name: Production Smoke

on:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for exact Vercel production commit and verify app
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://arles-garcia.vercel.app"
          EXPECTED_SHA="$GITHUB_SHA"
          echo "Waiting for Vercel production commit $EXPECTED_SHA..."
          ready=0

          for attempt in $(seq 1 30); do
            root_code=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' "$BASE_URL/" || true)
            version_code=$(curl -L -sS -o /tmp/version.json -w '%{http_code}' "$BASE_URL/api/version" || true)
            api_code=$(curl -L -sS -o /tmp/readiness.json -w '%{http_code}' "$BASE_URL/api/ai/readiness" || true)
            deployed_sha=$(node -e "try { const x=require('/tmp/version.json'); process.stdout.write(x.commitSha || '') } catch {}" 2>/dev/null || true)
            echo "Attempt $attempt: root=$root_code version=$version_code readiness=$api_code deployed=$deployed_sha"

            if [ "$root_code" = "200" ] && [ "$version_code" = "200" ] && [ "$api_code" = "200" ] && [ "$deployed_sha" = "$EXPECTED_SHA" ]; then
              ready=1
              break
            fi
            sleep 10
          done

          if [ "$ready" != "1" ]; then
            echo "Expected production commit did not become ready in time."
            exit 1
          fi

          grep -q '<div id="root"' /tmp/root.html
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/readiness.json','utf8')); if(x.ok!==true) process.exit(1); console.log('AI readiness:', JSON.stringify(x));"
